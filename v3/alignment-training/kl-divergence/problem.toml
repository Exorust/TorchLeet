description = "Implement KL divergence every way it shows up in ML: from probabilities and logits, F.kl_div semantics, Jensen-Shannon, forward vs reverse, Gaussian closed form, masked token-level KL, and the k1/k2/k3 estimators used in PPO and GRPO."
